<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>IELTS C1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
 --bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);
 --hint:var(--tg-theme-hint-color,#777);--btn:var(--tg-theme-button-color,#2481cc);
 --btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f1f4);
 --ok:#2e9d4f;--bad:#d64541;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:14px 14px 40px}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:17px;margin:14px 0 6px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--btn);color:var(--btx);cursor:pointer}
button.sec{background:var(--sec);color:var(--tx)}
button.ok{background:var(--ok);color:#fff}button.bad{background:var(--bad);color:#fff}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>button{flex:1;min-width:120px}
.card{background:var(--sec);border-radius:16px;padding:22px 16px;text-align:center;margin:12px 0;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.card .en{font-size:22px;font-weight:600}.card .ru{font-size:18px;margin-top:12px;color:var(--hint)}
.tag{font-size:12px;color:var(--hint)}
select{font:inherit;width:100%;padding:10px;border-radius:10px;border:0;background:var(--sec);color:var(--tx)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--sec);color:var(--tx)}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.stat{display:flex;gap:8px}.stat div{flex:1;background:var(--sec);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.passage{background:var(--sec);border-radius:12px;padding:12px;font-size:15px}
.passage p{margin:0 0 10px}.q{margin:14px 0}.q .st{margin-bottom:6px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;background:var(--sec);color:var(--tx)}
.seg button.on{background:var(--btn);color:var(--btx)}
.exp{font-size:14px;margin-top:6px;color:var(--hint)}
.back{background:none;color:var(--btn);padding:4px 0;margin-bottom:6px}
#timer{float:right;color:var(--hint)}
</style></head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script src="reading.js"></script>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='ielts_c1_srs_v1';
const INT=[0,1,2,4,8,16];
const today=()=>Math.floor(Date.now()/86400000);
let srs={};
try{srs=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){srs={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(srs))}catch(e){}};
const topics=[...new Set(WORDS.map(w=>w.topic))];
let topic='all';
const pool=()=>WORDS.filter(w=>topic==='all'||w.topic===topic);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function speak(t){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;
 const v=speechSynthesis.getVoices().find(x=>x.lang==='en-GB')||speechSynthesis.getVoices().find(x=>x.lang.startsWith('en'));
 if(v)u.voice=v;speechSynthesis.speak(u);
}
function rate(id,good){
 const e=srs[id]||{b:0,d:today()};
 e.b=good?Math.min(5,e.b+1):0;
 e.d=today()+INT[e.b];
 srs[id]=e;save();
}
function topicSelect(){
 return `<select id="tp"><option value="all">Все темы (300)</option>${topics.map(t=>`<option ${t===topic?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
}
function bindTopic(after){
 $('#tp').onchange=e=>{topic=e.target.value;after()};
}

/* ---------- HOME ---------- */
function home(){
 const t=today();
 const due=WORDS.filter(w=>srs[w.id]&&srs[w.id].d<=t).length;
 const known=WORDS.filter(w=>srs[w.id]&&srs[w.id].b>=3).length;
 const fresh=WORDS.filter(w=>!srs[w.id]).length;
 app.innerHTML=`<h1>IELTS C1 тренажёр</h1>
 <div class="stat"><div><b>${due}</b>повторить</div><div><b>${fresh}</b>новых</div><div><b>${known}</b>выучено</div></div>
 <h2>Тема</h2>${topicSelect()}
 <div class="row"><button id="b1">Карточки</button><button id="b2">Квиз</button></div>
 <div class="row"><button id="b3" class="sec">Reading: T / F / NG</button></div>
 <p class="tag">Карточки показываются с интервалами 1, 2, 4, 8, 16 дней. Ошибка возвращает карточку на сегодня.</p>`;
 bindTopic(home);
 $('#b1').onclick=cards;$('#b2').onclick=quiz;$('#b3').onclick=readingList;
}
const backBtn=()=>`<button class="back" id="bk">← Назад</button>`;
const bindBack=()=>{$('#bk').onclick=home};

/* ---------- CARDS ---------- */
function cards(){
 const t=today(),p=pool();
 const due=p.filter(w=>srs[w.id]&&srs[w.id].d<=t);
 const fresh=shuffle(p.filter(w=>!srs[w.id])).slice(0,10);
 let q=shuffle(due).concat(fresh),i=0;
 if(!q.length){app.innerHTML=backBtn()+`<h1>Готово</h1><p>На сегодня в этой теме карточек нет. Попробуй другую тему или квиз.</p>`;bindBack();return}
 const show=()=>{
  if(i>=q.length){app.innerHTML=backBtn()+`<h1>Сессия закончена</h1><p>Разобрано карточек: ${q.length}.</p><div class="row"><button id="again">Ещё раз</button></div>`;bindBack();$('#again').onclick=cards;return}
  const w=q[i];
  app.innerHTML=backBtn()+`<span class="tag">${i+1} / ${q.length} · ${esc(w.topic)}</span>
  <div class="card"><div class="en">${esc(w.en)}</div><div class="ru" id="ru" style="visibility:hidden">${esc(w.ru)}</div></div>
  <div class="row"><button class="sec" id="sp">🔊 Слушать</button><button id="rv">Показать перевод</button></div>
  <div class="row" id="ans" style="display:none"><button class="bad" id="no">Не помню</button><button class="ok" id="yes">Помню</button></div>`;
  bindBack();
  $('#sp').onclick=()=>speak(w.en);
  $('#rv').onclick=()=>{$('#ru').style.visibility='visible';$('#rv').style.display='none';$('#ans').style.display='flex'};
  $('#no').onclick=()=>{rate(w.id,false);i++;show()};
  $('#yes').onclick=()=>{rate(w.id,true);i++;show()};
 };
 show();
}

/* ---------- QUIZ ---------- */
function quiz(){
 const p=shuffle(pool()).slice(0,10);
 let i=0,score=0;
 const next=()=>{
  if(i>=p.length){
   app.innerHTML=backBtn()+`<h1>Результат: ${score} из ${p.length}</h1><p>Слова с ошибками вернулись в карточки на сегодня.</p><div class="row"><button id="again">Ещё раунд</button></div>`;
   bindBack();$('#again').onclick=quiz;return;
  }
  const w=p[i],dir=Math.random()<.5;
  const q=dir?w.en:w.ru,ans=dir?w.ru:w.en;
  const others=shuffle(WORDS.filter(x=>x.id!==w.id&&x.topic===w.topic)).slice(0,3).map(x=>dir?x.ru:x.en);
  const opts=shuffle([ans,...others]);
  app.innerHTML=backBtn()+`<span class="tag">${i+1} / ${p.length}</span><div class="card"><div class="en">${esc(q)}</div></div>`+
   opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')+`<div class="row"><button id="nx" style="display:none">Дальше</button></div>`;
  bindBack();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const picked=opts[+b.dataset.k],ok=picked===ans;
   document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(opts[+x.dataset.k]===ans)x.classList.add('right')});
   if(!ok){b.classList.add('wrong');rate(w.id,false)}else score++;
   if(dir===true||!ok)speak(w.en);
   $('#nx').style.display='block';$('#nx').onclick=()=>{i++;next()};
  });
 };
 next();
}

/* ---------- READING ---------- */
function readingList(){
 app.innerHTML=backBtn()+`<h1>Reading: T / F / NG</h1><p class="tag">Уровень C1. На каждый текст советую 10 минут, без словаря.</p>`+
  READING.map((r,k)=>`<div class="row"><button class="sec" data-k="${k}">${esc(r.title)}</button></div>`).join('');
 bindBack();
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>reading(+b.dataset.k));
}
function reading(k){
 const r=READING[k],ans=r.questions.map(()=>null);
 const t0=Date.now();
 const tick=setInterval(()=>{const el=$('#timer');if(!el){clearInterval(tick);return}
  const s=Math.floor((Date.now()-t0)/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
 app.innerHTML=backBtn()+`<span id="timer">00:00</span><h2>${esc(r.title)}</h2>
 <div class="passage">${r.text.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
 <h2>True / False / Not Given</h2>`+
 r.questions.map((q,i)=>`<div class="q" id="q${i}"><div class="st">${i+1}. ${esc(q.s)}</div>
  <div class="seg" data-i="${i}"><button data-v="T">True</button><button data-v="F">False</button><button data-v="NG">Not Given</button></div>
  <div class="exp" id="e${i}"></div></div>`).join('')+
 `<div class="row"><button id="ck">Проверить</button></div><div id="res"></div>`;
 bindBack();
 document.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const i=+sg.dataset.i;ans[i]=b.dataset.v;sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 }));
 $('#ck').onclick=()=>{
  clearInterval(tick);let s=0;
  r.questions.forEach((q,i)=>{
   const ok=ans[i]===q.a;if(ok)s++;
   $('#e'+i).innerHTML=`${ok?'✔':'✘'} Верно: <b>${q.a==='NG'?'Not Given':q.a==='T'?'True':'False'}</b>. ${esc(q.why)}`;
   $('#e'+i).style.color=ok?'var(--ok)':'var(--bad)';
  });
  const sec=Math.floor((Date.now()-t0)/1000);
  $('#res').innerHTML=`<h2>Результат: ${s} из ${r.questions.length} · ${Math.floor(sec/60)} мин ${sec%60} с</h2>
  <p class="tag">False: текст прямо противоречит. Not Given: текст о таком молчит.</p>`;
  $('#ck').style.display='none';window.scrollTo(0,document.body.scrollHeight);
 };
}
home();
</script></body></html>
